# Floor plan workbook in OneDrive 365 -> ZeroBias records, through the dynamic collector and the Microsoft Graph
# Excel data producer. Same mappings as dev's "OneDrive 365 Pipeline" (12743bb5-dfd7-4b46-8b63-11bf68a26737).
# Left out, because only a boundary knows them: the workbook (each mapping's source objectId/objectPath/schemaId), the
# context (boundary/target/scope), targets and the schedule. Set them when you create the pipeline.
# The mappings run in list order and that order matters: a link's property (planPosition, placement) is only written
# from the row that holds it, so File and FloorPlan load before the spaces, and spaces before what they contain.
# Needs the Drawable/Canvas model of the base schema (auditlogic/schema PR #228) on the environment.
id: 0201bd60-e171-491f-9751-e80be61dd7b3
name: OneDrive 365 Floor Plans
description: "Loads a floor plan workbook kept in OneDrive 365 into ZeroBias records, one mapping per sheet: File,
  FloorPlan, PhysicalSpace, PhysicalOpening, PhysicalAsset and PhysicalObject, with their canvases, placement and
  opening links. Choose the workbook, boundary and targets when you create the pipeline."
keywords:
  - onedrive
  - floor plan
  - workbook
  - excel
  - physical space
productId: 6ffa85fc-4a02-597c-ad12-e5976c6be67f
collectorArtifact: "@zerobias-org/collectorbot-zerobias-zerobias-dynamic"
